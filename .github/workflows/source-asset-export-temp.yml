name: Temporary Source Asset Export

on:
  push:
    branches:
      - feat/legacy-state-foundation-v1.2
    paths:
      - .github/workflows/source-asset-export-temp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Collect fighter source assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-assets
          cp assets/visual/v18/fighters/identity_atlas.png source-assets/
          cp -R assets/visual/v18/fighters/opponents source-assets/v18-opponents
          mkdir -p source-assets/v07
          cp assets/visual/v0.7/fighters/opponents/swarmer/op_swarmer_a_idle.png source-assets/v07/
          cp assets/visual/v0.7/fighters/opponents/outboxer/op_outboxer_a_idle.png source-assets/v07/
          cp assets/visual/v0.7/fighters/opponents/counter/op_counter_a_idle.png source-assets/v07/
          cp assets/visual/v0.7/portraits/portrait_swarmer_a.png source-assets/v07/
          cp assets/visual/v0.7/portraits/portrait_outboxer_a.png source-assets/v07/
          cp assets/visual/v0.7/portraits/portrait_counter_a.png source-assets/v07/
      - uses: actions/upload-artifact@v6
        with:
          name: temporary-fighter-source-assets
          path: source-assets
          if-no-files-found: error
          retention-days: 1
