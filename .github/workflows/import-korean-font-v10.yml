name: Import Korean Release Font v1.0

on:
  push:
    branches:
      - feat/bundled-korean-font-v1.0
    paths:
      - .github/workflows/import-korean-font-v10.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/import-korean-font-v10.yml

permissions:
  contents: write

jobs:
  import-verified-font:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/bundled-korean-font-v1.0
          fetch-depth: 1

      - name: Download upstream Noto Sans KR and OFL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf' \
            -o assets/fonts/NotoSansKR-VF.ttf
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/OFL.txt' \
            -o assets/fonts/OFL-NotoSansKR.txt

      - name: Verify exact upstream Git blobs and OFL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha1
          from pathlib import Path

          def git_blob(path: Path) -> str:
              data = path.read_bytes()
              return sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          font_path = Path('assets/fonts/NotoSansKR-VF.ttf')
          license_path = Path('assets/fonts/OFL-NotoSansKR.txt')
          font_blob = git_blob(font_path)
          license_blob = git_blob(license_path)
          expected_font = 'b386890ba945e1f39448a6b59f20c5d194f58808'
          expected_license = '1c9f43281b8f216c5461fe9ac729afbade7724e4'
          if font_blob != expected_font:
              raise SystemExit(f'Noto Sans KR upstream blob mismatch: {font_blob} != {expected_font}')
          if license_blob != expected_license:
              raise SystemExit(f'Noto Sans KR OFL blob mismatch: {license_blob} != {expected_license}')
          if font_path.stat().st_size < 1_000_000:
              raise SystemExit(f'font unexpectedly small: {font_path.stat().st_size} bytes')
          license_text = license_path.read_text(encoding='utf-8')
          if 'SIL OPEN FONT LICENSE Version 1.1' not in license_text:
              raise SystemExit('OFL 1.1 marker missing')

          print(f'font-bytes={font_path.stat().st_size}')
          print(f'font-git-blob={font_blob}')
          print(f'license-git-blob={license_blob}')
          print('font-license=OFL-1.1')
          PY

      - name: Commit verified font assets to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fonts/NotoSansKR-VF.ttf assets/fonts/OFL-NotoSansKR.txt
          git diff --cached --stat
          git commit -m 'assets: bundle verified Noto Sans KR release font'
          git push origin HEAD:feat/bundled-korean-font-v1.0
