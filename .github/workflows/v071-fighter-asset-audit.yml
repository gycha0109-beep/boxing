name: Fighter Asset Audit v0.7.1

on:
  push:
    branches:
      - chore/v071-fighter-asset-audit

permissions:
  contents: write

jobs:
  clean-commercial-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature head
        uses: actions/checkout@v7
        with:
          ref: feat/commercial-visual-integration-v0.7
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Verify fighter asset count
        shell: bash
        run: |
          set -euo pipefail
          count=$(find assets/visual/v0.7/fighters -type f -name '*.png' | wc -l | tr -d ' ')
          echo "fighter_png_count=$count"
          test "$count" -eq 40
      - name: Clean and replace cropped commercial fighter poses
        run: python tools/clean_fighter_assets_v071.py
      - name: Verify cleanup and substitutions are canonical
        shell: bash
        run: |
          set -euo pipefail
          python tools/clean_fighter_assets_v071.py --check-only | tee /tmp/v071-check.txt
          if grep -Eq 'removed=[1-9][0-9]*' /tmp/v071-check.txt; then
            echo 'cleanup is not idempotent; residual disconnected contamination remains'
            exit 1
          fi
      - name: Validate changed asset scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only -- assets/visual/v0.7/fighters)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -gt 0
          test "${#changed[@]}" -le 40
          for path in "${changed[@]}"; do
            case "$path" in
              assets/visual/v0.7/fighters/player/*.png|assets/visual/v0.7/fighters/opponents/swarmer/*.png|assets/visual/v0.7/fighters/opponents/outboxer/*.png|assets/visual/v0.7/fighters/opponents/slugger/*.png|assets/visual/v0.7/fighters/opponents/counter/*.png) ;;
              *) echo "unexpected changed path: $path"; exit 1 ;;
            esac
          done
      - name: Commit cleaned binary assets to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/visual/v0.7/fighters
          git diff --cached --quiet && { echo 'no cleaned PNG changes'; exit 1; }
          git commit -m 'assets: replace cropped slugger and counter sprites v0.7.1'
          git push origin HEAD:feat/commercial-visual-integration-v0.7
