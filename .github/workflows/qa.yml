name: QA

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  assistant-visual-patch:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore: run assistant visual patch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/legacy-state-foundation-v1.2
          fetch-depth: 0
      - name: Apply focused visual patch and clean temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          catalog = Path("scripts/ui/visual_asset_catalog.gd")
          text = catalog.read_text(encoding="utf-8")
          old = 'const IDENTITY_ATLAS := "res://assets/visual/v18/fighters/identity_atlas.png"\nstatic var _identity_cache: Dictionary = {}'
          new = 'const IDENTITY_ATLAS := "res://assets/visual/v18/fighters/identity_atlas.png"\nconst UNIQUE_IDENTITY_ROOT := "res://assets/visual/v18/fighters/opponents"\nstatic var _identity_cache: Dictionary = {}'
          if old not in text:
              raise SystemExit("identity atlas anchor missing")
          text = text.replace(old, new, 1)
          pattern = r'static func identity_portrait_texture\(is_player: bool, style_id: String = ""\) -> Texture2D:\n.*?\n(?=static func normalize_style)'
          replacement = '''static func identity_portrait_texture(is_player: bool, style_id: String = "") -> Texture2D:
    var key := "portrait_%s_%s" % [str(is_player), style_id]
    if _identity_cache.has(key): return _identity_cache[key]
    var fighter := identity_fighter_texture(is_player, style_id)
    var portrait := _identity_portrait_from_texture(fighter)
    if portrait == null: return portrait_texture(is_player, style_id)
    _identity_cache[key] = portrait
    return portrait

static func opponent_identity_path_for_name(opponent_name: String) -> String:
    _load_opponents()
    var meta: Dictionary = _opponent_cache.get(opponent_name, {})
    var opponent_id := str(meta.get("id", "")).strip_edges()
    if opponent_id.is_empty(): return ""
    return "%s/%s.png" % [UNIQUE_IDENTITY_ROOT, opponent_id]

static func has_unique_identity_for_name(opponent_name: String) -> bool:
    var path := opponent_identity_path_for_name(opponent_name)
    return not path.is_empty() and ResourceLoader.exists(path)

static func identity_fighter_texture_for_name(opponent_name: String) -> Texture2D:
    var key := "named_fighter_" + opponent_name
    if _identity_cache.has(key): return _identity_cache[key]
    var unique_path := opponent_identity_path_for_name(opponent_name)
    var fighter: Texture2D = null
    if not unique_path.is_empty() and ResourceLoader.exists(unique_path):
        fighter = texture(unique_path)
    if fighter == null:
        fighter = identity_fighter_texture(false, opponent_visual_style_for_name(opponent_name))
    _identity_cache[key] = fighter
    return fighter

static func identity_portrait_texture_for_name(opponent_name: String) -> Texture2D:
    var key := "named_portrait_" + opponent_name
    if _identity_cache.has(key): return _identity_cache[key]
    var fighter := identity_fighter_texture_for_name(opponent_name)
    var portrait := _identity_portrait_from_texture(fighter)
    if portrait == null:
        portrait = identity_portrait_texture(false, opponent_visual_style_for_name(opponent_name))
    _identity_cache[key] = portrait
    return portrait

static func _identity_portrait_from_texture(fighter: Texture2D) -> Texture2D:
    if fighter == null: return null
    var portrait := AtlasTexture.new()
    var region := Rect2()
    if fighter is AtlasTexture:
        var fighter_atlas := fighter as AtlasTexture
        portrait.atlas = fighter_atlas.atlas
        region = fighter_atlas.region
    else:
        portrait.atlas = fighter
        var image := fighter.get_image()
        var used := Rect2i(0, 0, fighter.get_width(), fighter.get_height())
        if image != null:
            var detected := image.get_used_rect()
            if detected.size.x > 0 and detected.size.y > 0: used = detected
        region = Rect2(Vector2(used.position), Vector2(used.size))
    region.position.x += region.size.x * 0.12
    region.size.x *= 0.78
    region.size.y *= 0.46
    portrait.region = region
    return portrait

'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"portrait function replacement count={count}")
          catalog.write_text(text, encoding="utf-8")

          main = Path("scripts/main_v18.gd")
          text = main.read_text(encoding="utf-8")
          pairs = [
              ('return VisualAssetCatalog.identity_portrait_texture(false, _v17_visual_style(opponent))', 'return VisualAssetCatalog.identity_portrait_texture_for_name(str(opponent.get("name", "")))'),
              ('portrait.custom_minimum_size = Vector2(0, 80)', 'portrait.custom_minimum_size = Vector2(0, 92)'),
              ('portrait.custom_minimum_size = Vector2(122, 160)', 'portrait.custom_minimum_size = Vector2(128, 166)'),
              ('portrait.custom_minimum_size = Vector2(36, 62)', 'portrait.custom_minimum_size = Vector2(42, 64)'),
          ]
          for old, new in pairs:
              if old not in text:
                  raise SystemExit(f"main_v18 target missing: {old}")
              text = text.replace(old, new, 1)
          main.write_text(text, encoding="utf-8")

          stage = Path("scripts/ui/fight_stage.gd")
          text = stage.read_text(encoding="utf-8")
          pattern = r'func _draw_fighter_asset_or_fallback\(center: Vector2, facing: float, is_player: bool, style_id: String, tint: Color, pose: String\) -> void:\n.*?\n(?=func _identity_height)'
          replacement = '''func _draw_fighter_asset_or_fallback(center: Vector2, facing: float, is_player: bool, style_id: String, tint: Color, pose: String) -> void:
    var texture := VisualAssetCatalog.identity_fighter_texture(true, style_id) if is_player else VisualAssetCatalog.identity_fighter_texture_for_name(opponent_name)
    if texture == null: _draw_fighter(center, facing, tint, pose); return
    var source_rect := _texture_used_rect(texture)
    if source_rect.size.x <= 0 or source_rect.size.y <= 0: _draw_fighter(center, facing, tint, pose); return
    var target_height := _identity_height(is_player, style_id)
    if pose == "down":
        _draw_articulated_knockdown(texture, source_rect, center, facing, target_height)
        return
    var target_width := target_height * float(source_rect.size.x) / float(source_rect.size.y)
    var destination_rect := Rect2(-target_width * 0.5, -target_height, target_width, target_height)
    var angle := -facing * 0.06 * animation_progress if pose == "hurt" else 0.0
    var bounds := Rect2(Vector2.ZERO, Vector2.ZERO)
    for point in [destination_rect.position, Vector2(destination_rect.end.x, destination_rect.position.y), destination_rect.end, Vector2(destination_rect.position.x, destination_rect.end.y)]:
        bounds = bounds.expand((point * Vector2(facing, 1.0)).rotated(angle))
    var origin := Vector2(clampf(center.x, 8.0 - bounds.position.x, size.x - 8.0 - bounds.end.x), size.y - 18.0 - bounds.end.y)
    for sole in [Vector2(-0.40, -0.005), Vector2(0.36, -0.025)]:
        var contact := origin + (Vector2(sole.x * target_width * facing, sole.y * target_height)).rotated(angle)
        draw_set_transform(contact, 0, Vector2(1, 0.20))
        draw_circle(Vector2.ZERO, target_width * 0.105, Color(0, 0, 0, 0.42))
    draw_set_transform(origin, angle, Vector2(facing, 1.0))
    draw_texture_rect_region(texture, destination_rect, Rect2(Vector2(source_rect.position), Vector2(source_rect.size)), Color.WHITE, false, true)
    draw_set_transform(Vector2.ZERO, 0.0, Vector2.ONE)

func _draw_articulated_knockdown(texture: Texture2D, source_rect: Rect2i, center: Vector2, facing: float, standing_height: float) -> void:
    var split_y := clampi(int(round(source_rect.size.y * 0.58)), 1, source_rect.size.y - 1)
    var upper_source := Rect2(Vector2(source_rect.position), Vector2(source_rect.size.x, split_y))
    var lower_source := Rect2(Vector2(source_rect.position.x, source_rect.position.y + split_y), Vector2(source_rect.size.x, source_rect.size.y - split_y))
    var total_length := minf(size.x * 0.44, standing_height * 0.78)
    var upper_length := total_length * 0.60
    var lower_length := total_length * 0.46
    var upper_width := maxf(34.0, upper_length * upper_source.size.x / maxf(1.0, upper_source.size.y))
    var lower_width := maxf(30.0, lower_length * lower_source.size.x / maxf(1.0, lower_source.size.y))
    var upper_rect := Rect2(-upper_width * 0.5, -upper_length, upper_width, upper_length)
    var lower_rect := Rect2(-lower_width * 0.5, 0.0, lower_width, lower_length)
    var upper_angle := -facing * PI * 0.40
    var lower_angle := -facing * PI * 0.20
    var bounds := Rect2(Vector2.ZERO, Vector2.ZERO)
    for point in [upper_rect.position, Vector2(upper_rect.end.x, upper_rect.position.y), upper_rect.end, Vector2(upper_rect.position.x, upper_rect.end.y)]:
        bounds = bounds.expand((point * Vector2(facing, 1.0)).rotated(upper_angle))
    for point in [lower_rect.position, Vector2(lower_rect.end.x, lower_rect.position.y), lower_rect.end, Vector2(lower_rect.position.x, lower_rect.end.y)]:
        bounds = bounds.expand((point * Vector2(facing, 1.0)).rotated(lower_angle))
    var hip := Vector2(clampf(center.x, 10.0 - bounds.position.x, size.x - 10.0 - bounds.end.x), size.y - 18.0 - bounds.end.y)
    draw_set_transform(Vector2(hip.x + bounds.get_center().x, size.y - 18.5), 0.0, Vector2(1.0, 0.12))
    draw_circle(Vector2.ZERO, total_length * 0.40, Color(0, 0, 0, 0.30))
    draw_set_transform(hip, upper_angle, Vector2(facing, 1.0))
    draw_texture_rect_region(texture, upper_rect, upper_source, Color.WHITE, false, true)
    draw_set_transform(hip, lower_angle, Vector2(facing, 1.0))
    draw_texture_rect_region(texture, lower_rect, lower_source, Color.WHITE, false, true)
    draw_set_transform(Vector2.ZERO, 0.0, Vector2.ONE)

'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"fight stage replacement count={count}")
          old = 'var texture := VisualAssetCatalog.identity_fighter_texture(is_player, style_id)\n    if texture == null: return COMMERCIAL_STAND_HEIGHT'
          new = 'var texture := VisualAssetCatalog.identity_fighter_texture(true, style_id) if is_player else VisualAssetCatalog.identity_fighter_texture_for_name(opponent_name)\n    if texture == null: return COMMERCIAL_STAND_HEIGHT'
          if old not in text:
              raise SystemExit("identity height target missing")
          text = text.replace(old, new, 1)
          stage.write_text(text, encoding="utf-8")

          smoke = Path("tests/v07_visual_integration_smoke.gd")
          text = smoke.read_text(encoding="utf-8")
          anchor = '    _check(VisualAssetCatalog.opponent_visual_style_for_name("에번 브룩스") == "swarmer", "Black opponent fight set mapping mismatch")\n'
          addition = anchor + '    _check(VisualAssetCatalog.opponent_identity_path_for_name("박태호").ends_with("fighters/opponents/park_tae-ho.png"), "named opponent identity path is not stable")\n    _check(VisualAssetCatalog.identity_fighter_texture_for_name("박태호") != null, "named opponent fighter fallback unavailable")\n    _check(VisualAssetCatalog.identity_portrait_texture_for_name("박태호") != null, "named opponent portrait fallback unavailable")\n'
          if anchor not in text:
              raise SystemExit("v07 smoke anchor missing")
          smoke.write_text(text.replace(anchor, addition, 1), encoding="utf-8")

          qa = Path(".github/workflows/qa.yml")
          q = qa.read_text(encoding="utf-8")
          q = q.replace("permissions:\n  contents: write", "permissions:\n  contents: read", 1)
          q, count = re.subn(r'  assistant-visual-patch:\n.*?\n(?=  deterministic-data-and-balance:)', '', q, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("could not remove temporary QA patch job")
          qa.write_text(q, encoding="utf-8")
          Path(".github/workflows/assistant-visual-patch.yml").unlink(missing_ok=True)
          Path(".assistant-visual-patch-trigger").unlink(missing_ok=True)
          PY
          git diff --check
          python3 tools/project_sanity.py
          git config user.name "OpenAI Worker"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "refactor(visual): add named identity slots and articulated knockdowns"
          git push origin HEAD:feat/legacy-state-foundation-v1.2

  deterministic-data-and-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate content data
        run: python3 tools/test_data.py
      - name: Validate fighter identity, scouting, and game-plan data
        run: python3 tools/test_gameplans.py
      - name: Validate project structure
        run: python3 tools/project_sanity.py
      - name: Validate iOS release packaging contract
        run: python3 tools/validate_ios_release_v09.py
      - name: Validate bundled Korean release font
        run: python3 tools/validate_release_font_v10.py
      - name: Validate App Icon v1.0
        run: python3 tools/validate_app_icon_v10.py
      - name: Validate v0.7 visual asset contract
        run: python3 tools/validate_visual_assets_v07.py
      - name: Validate career invariants
        run: python3 tools/test_career_logic.py
      - name: Simulate opponent ladder
        run: python3 tools/simulate_balance.py
      - name: Simulate game-plan matchups
        run: python3 tools/simulate_gameplans.py
      - name: Simulate 10,000 careers
        run: python3 tools/simulate_careers.py

  godot-headless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_ZIP_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
    steps:
      - uses: actions/checkout@v7
      - name: Install verified Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$url"
          echo "${GODOT_ZIP_SHA256}  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Verify engine version
        run: Godot_v${GODOT_VERSION}_linux.x86_64 --version
      - name: Parse and import project headlessly
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/godot-import.log"
          timeout 90s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee "$log"
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Failed to create an autoload|Failed to instantiate an autoload|does not inherit from' "$log"; then
            echo "Godot import emitted a script/autoload failure" >&2
            exit 1
          fi
      - name: Boot main scene headlessly
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/godot-boot.log"
          timeout 30s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --quit-after 5 2>&1 | tee "$log"
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Failed to instantiate an autoload|does not inherit from' "$log"; then
            echo "Godot boot emitted a script/autoload failure" >&2
            exit 1
          fi
      - name: Verify save recovery and deterministic fight resume
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/runtime_state_smoke.gd
      - name: Verify retirement legacy selection and generation handoff
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/legacy_retirement_smoke.gd
      - name: Verify full legacy slots, stacking, and runtime meta effects
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/legacy_slot_effect_smoke.gd
      - name: Verify one-growth tactical and condition preparation flow
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/pre_fight_preparation_smoke.gd
      - name: Verify boxer style choice, natural talent, and world-title pacing
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/boxer_creation_ladder_smoke.gd
      - name: Verify low-base stats and equipment economy
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/equipment_economy_smoke.gd
      - name: Verify dynamic BGM, UI cues, and impact ducking
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/audio_music_smoke.gd
      - name: Verify fighter identity, scouting, and game-plan flow
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/v03_gameplan_smoke.gd
      - name: Verify telegraph, structured exchange, and combat feedback flow
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/v04_combat_ux_smoke.gd
      - name: Verify fight screen renders and consumes telegraphed action
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/v04_fight_ui_smoke.gd
      - name: Verify fight stage animation, impact SFX routing, and haptic profile
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/v05_fight_presentation_smoke.gd
      - name: Verify hit-stop, shake, arena audio, safe area, touch targets, lifecycle hooks, and fight BGM
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/v06_device_polish_smoke.gd
      - name: Verify v0.7 commercial visual mapping and procedural fallback
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/v07_visual_integration_smoke.gd
      - name: Verify v0.8 first-five-minutes release flow and BGM transitions
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/v08_first_five_minutes_smoke.gd
      - name: Verify v1.0 bundled Korean release font
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/v10_release_font_smoke.gd
      - name: Verify mobile card scrolling and opponent back navigation
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/mobile_scroll_back_smoke.gd
      - name: Verify fixed no-scroll fight HUD
        run: timeout 60s Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path . --script res://tests/fight_fixed_hud_smoke.gd
