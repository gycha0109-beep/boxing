name: iOS Export Link v0.9

on:
  push:
    branches:
      - feat/ios-release-packaging-v0.9
    paths:
      - .github/workflows/ios-export-link-v09.yml
      - export_presets.cfg
      - project.godot
      - scripts/**
      - scenes/**
      - assets/**
      - data/**
  pull_request:
    paths:
      - .github/workflows/ios-export-link-v09.yml
      - export_presets.cfg
      - project.godot
      - scripts/**
      - scenes/**
      - assets/**
      - data/**

permissions:
  contents: read

jobs:
  ios-export-and-link:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_TEMPLATE_VERSION: 4.7.2.stable
      GODOT_MAC_SHA256: c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e
      GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
    steps:
      - uses: actions/checkout@v7

      - name: Verify Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install verified Godot 4.7.2 editor
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$url"
          echo "${GODOT_MAC_SHA256}  $RUNNER_TEMP/godot.zip" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install verified Godot 4.7.2 export templates
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/templates.tpz" "$url"
          echo "${GODOT_TEMPLATES_SHA256}  $RUNNER_TEMP/templates.tpz" | shasum -a 256 -c
          rm -rf "$RUNNER_TEMP/templates-unpacked"
          mkdir -p "$RUNNER_TEMP/templates-unpacked"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates-unpacked"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"
          cp -R "$RUNNER_TEMP/templates-unpacked/templates/." "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/ios.zip"
          echo "template_dir=$TEMPLATE_DIR"

      - name: Prepare non-production CI export identity and opaque icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios build/ci
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib

          width = height = 1024
          row = b'\x00' + bytes((16, 19, 27)) * width
          raw = row * height
          def chunk(kind: bytes, payload: bytes) -> bytes:
              return struct.pack('>I', len(payload)) + kind + payload + struct.pack('>I', zlib.crc32(kind + payload) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw, 9))
          png += chunk(b'IEND', b'')
          Path('build/ci/ios-ci-icon.png').write_bytes(png)

          preset = Path('export_presets.cfg')
          text = preset.read_text(encoding='utf-8')
          text = text.replace('application/app_store_team_id=""', 'application/app_store_team_id="ABCDE12XYZ"')
          text = text.replace('application/bundle_identifier=""', 'application/bundle_identifier="com.example.twelvecount.ci"')
          text = text.replace('icons/app_store_1024x1024=""', 'icons/app_store_1024x1024="res://build/ci/ios-ci-icon.png"')
          preset.write_text(text, encoding='utf-8')

          project = Path('project.godot')
          project_text = project.read_text(encoding='utf-8')
          project_text = project_text.replace('config/version="1.0.0"', 'config/version="1.0.0"\nconfig/icon="res://build/ci/ios-ci-icon.png"')
          project.write_text(project_text, encoding='utf-8')
          PY
          file build/ci/ios-ci-icon.png
          grep -F 'application/app_store_team_id="ABCDE12XYZ"' export_presets.cfg
          grep -F 'application/bundle_identifier="com.example.twelvecount.ci"' export_presets.cfg

      - name: Export Godot iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          "$GODOT_BIN" --headless --path . --export-release "iOS Release" build/ios/TwelveCount.xcodeproj 2>&1 | tee "$RUNNER_TEMP/godot-ios-export.log"
          test -d build/ios/TwelveCount.xcodeproj
          test -f build/ios/TwelveCount.xcodeproj/project.pbxproj
          find build/ios -maxdepth 2 -type f | sort | head -100

      - name: Inspect generated Xcode target
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project build/ios/TwelveCount.xcodeproj -list -json | tee "$RUNNER_TEMP/xcode-list.json"
          TARGET_NAME=$(python3 - <<'PY'
          import json, os
          p = os.environ['RUNNER_TEMP'] + '/xcode-list.json'
          data = json.load(open(p, encoding='utf-8'))
          targets = data.get('project', {}).get('targets', [])
          if not targets:
              raise SystemExit('no Xcode target generated')
          print(targets[0])
          PY
          )
          echo "TARGET_NAME=$TARGET_NAME" >> "$GITHUB_ENV"
          echo "generated_target=$TARGET_NAME"

      - name: Build and link unsigned arm64 iPhone target
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project build/ios/TwelveCount.xcodeproj \
            -target "$TARGET_NAME" \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-ios.log"

      - name: Reject known Godot 4.7 SDL linker regression
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/xcodebuild-ios.log"
          if test -f "$log" && grep -Eq '_SDL_IsIPad|_SDL_IsAppleTV' "$log"; then
            echo 'Known Godot 4.7-family iOS SDL linker regression detected.' >&2
            exit 1
          fi

      - name: Upload iOS export/link evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: twelve-count-v09-ios-export-link-evidence
          path: |
            build/ios/TwelveCount.xcodeproj/project.pbxproj
            ${{ runner.temp }}/godot-ios-export.log
            ${{ runner.temp }}/xcode-list.json
            ${{ runner.temp }}/xcodebuild-ios.log
          if-no-files-found: warn
          retention-days: 3
